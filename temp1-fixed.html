<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed Background Template - 3D Showcase</title>
    <link rel="stylesheet" href="temp1.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Spline Viewer -->
    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.12.5/build/spline-viewer.js"></script>

    <!-- Three.js for GLB -->
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            
        }
    }
    </script>

    <style>
        /* Additional styles for 3D sections */
        .spline-section {
            height: 100vh;
            position: relative;
            background: #000;
        }

        spline-viewer {
            width: 100%;
            height: 100%;
        }

        .hornet-section {
            display: none;
            position: relative;
            min-height: 300vh;
            background: #0a0a0a;
        }

        #hornet-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 1;
        }

        .hornet-content {
            position: relative;
            z-index: 10;
            pointer-events: none;
        }

        .scroll-box {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
        }

        .content-panel {
            max-width: 600px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            padding: 3rem;
            border-radius: 20px;
            color: white;
            pointer-events: all;
        }

        .content-panel h2 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #667eea 0%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .content-panel p {
            font-size: 1.1rem;
            line-height: 1.8;
        }
    </style>
</head>

<body>
    <!-- Hero Section -->
    <div class="img">
        <img src="https://picsum.photos/seed/hero/2560/1440" alt="Hero image"
            style="width:100vw; height:100vh; object-fit:cover; display:block;">
        <div class="h1">
            <h1>Fixed Background Template</h1>
            <p>Scroll down to see 3D models and parallax effects</p>
        </div>
    </div>

    <!-- Spline Interactive 3D Section -->
    <div class="spline-section">
        <spline-viewer url="https://prod.spline.design/mart2Np6SKtJa-J8/scene.splinecode"></spline-viewer>
    </div>

    <!-- Hornet GLB 3D Model Section -->


    <!-- Feature Boxes Grid -->
    <div class="icons">
        <div class="iconbox fixed-bg" style="background-image: url('https://picsum.photos/id/1018/1200/800');">
            <h3>Feature One</h3>
            <p>Stunning fixed background effects with depth.</p>
        </div>

        <div class="secbox fixed-bg" style="background-image: url('https://picsum.photos/id/1015/1200/800');">
            <h3>Feature Two</h3>
            <p>Beautiful parallax scrolling experience.</p>
        </div>

        <div class="thirdbox fixed-bg" style="background-image: url('https://picsum.photos/id/1019/1200/800');">
            <h3>Feature Three</h3>
            <p>Fast loading and optimized performance.</p>
        </div>

        <div class="thirdbox fixed-bg" style="background-image: url('https://picsum.photos/id/1016/1200/800');">
            <h3>Feature Four</h3>
            <p>Premium quality responsive design.</p>
        </div>
    </div>

    <!-- Three.js Script for Hornet Model -->
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        document.getElementById('hornet-canvas').appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 2;

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(5, 10, 7);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        const pointLight1 = new THREE.PointLight(0x667eea, 2, 50);
        pointLight1.position.set(-5, 3, 5);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0xf093fb, 2, 50);
        pointLight2.position.set(5, 3, -5);
        scene.add(pointLight2);

        // Load model
        let model, mixer;
        const loader = new GLTFLoader();

        loader.load(
            'module/silksong__hornet_fanart.glb',
            function (gltf) {
                model = gltf.scene;

                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());

                const maxDim = Math.max(size.x, size.y, size.z);
                const scale = 2 / maxDim;
                model.scale.multiplyScalar(scale);
                model.userData.scale = scale;
                model.position.sub(center.multiplyScalar(scale));

                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });

                if (gltf.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(model);
                    gltf.animations.forEach((clip) => mixer.clipAction(clip).play());
                }

                scene.add(model);
            },
            (xhr) => console.log('Loading: ' + Math.round((xhr.loaded / xhr.total) * 100) + '%'),
            (error) => console.error('Error loading model:', error)
        );

        // Scroll animation
        const hornetSection = document.querySelector('.hornet-section');
        window.addEventListener('scroll', () => {
            const scrollY = window.scrollY;
            const hornetTop = hornetSection.offsetTop;
            const hornetHeight = hornetSection.offsetHeight;

            if (scrollY >= hornetTop && scrollY < hornetTop + hornetHeight) {
                const sectionScroll = scrollY - hornetTop;
                const progress = sectionScroll / hornetHeight;

                if (model) {
                    model.rotation.y = progress * Math.PI * 4;
                    model.position.y = Math.sin(progress * Math.PI * 2) * 0.5;
                    model.position.x = Math.cos(progress * Math.PI * 2) * 0.3;
                }

                pointLight1.intensity = 1 + Math.sin(progress * Math.PI * 4) * 0.5;
                pointLight2.intensity = 1 + Math.cos(progress * Math.PI * 4) * 0.5;
            }
        });

        // Animation loop
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);

            if (mixer) mixer.update(clock.getDelta());

            const time = clock.getElapsedTime();
            pointLight1.position.x = Math.cos(time * 0.5) * 5;
            pointLight1.position.z = Math.sin(time * 0.5) * 5;
            pointLight2.position.x = Math.cos(time * 0.5 + Math.PI) * 5;
            pointLight2.position.z = Math.sin(time * 0.5 + Math.PI) * 5;

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>


    <div class="iconmanual" style="position: relative; width: 50px; height: 50px; background-color: #667eea;" >
        <span style="width: 100%; height: 10%; position: absolute; top: 0; left: 0;"> </span>
        <span style="width: 100%; height: 10%; position: absolute; top: 0; left: 0;"></span>
        <span style="width: 100%; height: 10%; position: absolute; top: 0; left: 0;"></span>
    </div>
</body>

</html>
