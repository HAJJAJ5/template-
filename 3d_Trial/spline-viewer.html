<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spline 3D Interactive Scene</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        spline-viewer {
            width: 100%;
            height: 100vh;
            display: block;
        }

        .info-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            color: white;
            padding: 2rem;
            border-radius: 16px;
            max-width: 350px;
            z-index: 100;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #667eea 0%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.9);
        }
    </style>
</head>

<body>
    <!-- Info Panel -->
    <div class="info-panel">
        <h1>Interactive 3D Scene</h1>
        <p>This is a Spline interactive 3D scene. Click and drag to interact with the 3D objects!</p>
    </div>

    <!-- Spline 3D Viewer -->
    <spline-viewer url="https://prod.spline.design/mart2Np6SKtJa-J8/scene.splinecode"></spline-viewer>

    <!-- Spline Viewer Script -->
    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.12.5/build/spline-viewer.js"></script>
</body>

</html>
